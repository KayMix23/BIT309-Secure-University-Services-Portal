# PostgreSQL illustrative settings; confirm compatibility before applying.
# Listen only on private interface; firewall should restrict app-tier source.
listen_addresses = '10.10.20.10'
password_encryption = 'scram-sha-256'
ssl = on
log_connections = on
log_disconnections = on
log_statement = 'ddl'
